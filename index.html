<!DOCTYPE html>
<html>
<head>
  <title>S7ADOW API</title>
  <style>
    body { font-family: Arial; background:#111; color:#fff; text-align:center }
    input, button { padding:10px; margin:5px; border:none }
    button { background:#00ffcc; cursor:pointer }
  </style>
</head>
<body>

<h1>🔥 S7ADOW API</h1>

<!-- 🔍 البحث -->
<h2>بحث يوتيوب</h2>
<input id="search" placeholder="اكتب اسم">
<button onclick="searchYT()">بحث</button>

<div id="results"></div>

<!-- 📥 تحميل -->
<h2>تحميل من رابط</h2>
<input id="url" placeholder="حط الرابط">
<button onclick="downloadVideo()">تحميل فيديو</button>

<!-- 🔗 APIs -->
<h2>APIs</h2>

<div>
  <p>/api/youtube/search?q=TEXT</p>
  <button onclick="copy('/api/youtube/search?q=test')">نسخ</button>
</div>

<div>
  <p>/api/youtube/video?url=LINK</p>
  <button onclick="copy('/api/youtube/video?url=link')">نسخ</button>
</div>

<script>
function copy(text){
  navigator.clipboard.writeText(window.location.origin + text)
  alert("تم النسخ ✅")
}

async function searchYT(){
  let q = document.getElementById("search").value
  let res = await fetch("/api/youtube/search?q=" + q)
  let data = await res.json()

  let html = ""
  data.forEach(v=>{
    html += `<p>${v.title}<br>
    <button onclick="copy('${v.url}')">نسخ الرابط</button></p>`
  })

  document.getElementById("results").innerHTML = html
}

function downloadVideo(){
  let url = document.getElementById("url").value
  window.open("/api/youtube/video?url=" + url)
}
</script>

</body>
</html>
